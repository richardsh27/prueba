<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi primera página</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #222;
    }
    h1 { color: #2563eb; }
    button {
      padding: 10px 18px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <h1>¡Hola, mundo!</h1>
  <p>Esta es mi primera página, guardada en GitHub.</p>
  <button onclick="saludar()">Púlsame</button>
  <p id="mensaje"></p>

  <script>
    function saludar() {
      document.getElementById("mensaje").textContent =
        "¡Funciona! Hoy es " + new Date().toLocaleDateString("es-PE") + ".";
    }
  </script>
</body>
</html>
